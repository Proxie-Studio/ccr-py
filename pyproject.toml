[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccr-py"
version = "1.0.0"
description = "Decentralised belief/evidence pairs, snapshots, pluggable aggregation and decision lineage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy", "ruff"]

[tool.hatch.build]
exclude = ["**/._*", "**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
